name: check
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *" # each day: the examples against the latest release
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make build

  example:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        example: [device-gateway, dotnet-fleet, gpu-box, home-assistant, pihole, reverse-proxy]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make ${{ matrix.example }}
