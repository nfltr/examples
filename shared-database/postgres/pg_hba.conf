# Who Postgres lets in, and how. nfltr cat serve on this machine connects
# from 127.0.0.1 on behalf of every address holder, so a loopback
# connection must prove a password (the official image trusts loopback
# by default).
# TYPE  DATABASE  USER  ADDRESS       METHOD
local   all       all                 trust
host    all       all   127.0.0.1/32  scram-sha-256
host    all       all   ::1/128       scram-sha-256
